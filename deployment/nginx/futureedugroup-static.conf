# Include these locations inside the HTTPS server block that serves the Next.js
# `out/` directory. Do not use an SPA fallback such as `/index.html`: it turns
# unknown URLs into successful home-page responses and creates soft 404s.

location = / {
    try_files /index.html =404;
}

# Next requires one generated path for an empty static dynamic route. Keep the
# generated sentinel inaccessible so it cannot become a soft 404 or be indexed.
location ~ ^/blogs/__build-placeholder__(?:/|$) {
    return 404;
}

location / {
    # Next static export emits route pages as `<route>.html`.
    try_files $uri.html $uri =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}
